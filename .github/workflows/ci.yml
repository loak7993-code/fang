name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Learn examples run
        run: FANG=./target/release/fang bash tools/check_learn.sh
      - name: Learn course check
        run: FANG=./target/release/fang bash tools/check_learn_cmd.sh
      - name: Benchmarks compile and run
        run: FANG=./target/release/fang bash bench/run.sh

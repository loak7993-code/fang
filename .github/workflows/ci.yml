name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Learn examples run
        run: FANG=./target/release/fang bash tools/check_learn.sh
      - name: Learn course check
        run: FANG=./target/release/fang bash tools/check_learn_cmd.sh
      - name: Benchmarks compile and run
        run: FANG=./target/release/fang bash bench/run.sh

  pages:
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
